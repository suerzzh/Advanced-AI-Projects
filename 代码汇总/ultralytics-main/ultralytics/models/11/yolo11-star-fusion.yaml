# Ultralytics YOLO 🚀, AGPL-3.0 license
# Star-Fusion-YOLO: Optimized for SeaShips Dataset
# Based on PPT Design: Light-Backbone + Star-Fusion + CBAM + LSCD

# Parameters
[cite_start]nc: 6  # SeaShips: ore carrier, bulk cargo, etc. [cite: 180]
scales: # model compound scaling constants, i.e. 'n'
  n: [0.50, 0.25, 1024]

# 01. Backbone (Light-Backbone with StarBlocks & CBAM) 
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  
  # Improvement 1: Star Blocks replacing C3k2 [cite: 104]
  - [-1, 2, StarBlock, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, StarBlock, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, StarBlock, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, StarBlock, [1024, True]]       # 8
  
  # Improvement 2: CBAM Attention before SPPF [cite: 128]
  - [-1, 1, CBAM, [1024]]       # 9 Attention Mechanism
  
  - [-1, 1, SPPF, [1024, 5]]    # 10
  - [-1, 1, C2PSA, [1024]]      # 11

# 02. Head (Neck + LSCD)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  
  # Improvement 3: C3k2-Star for Feature Fusion [cite: 48]
  - [-1, 2, C3k2_Star, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_Star, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_Star, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_Star, [1024, True]] # 23 (P5/32-large)

  # Improvement 4: LSCD Detect Head [cite: 52]
  - [[17, 20, 23], 1, LSCD_Detect, [nc]] # 24 Detect(P3, P4, P5)